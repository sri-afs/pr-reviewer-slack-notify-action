name: "PR Reviewer Slack Notify Action"
description: "Blow up a channel with @s when adding people to review your PR."
branding:
  color: blue
  icon: at-sign
inputs:
  aws-region:
    description: 'Region in which the GitHub-team -> Slack-user-group mapping JSON is stored. Required unless team-mapping-json is provided.'
    required: false
    default: ""
  aws-s3-bucket:
    description: 'S3 bucket holding the GitHub-team -> Slack-user-group mapping JSON object. Required unless team-mapping-json is provided.'
    required: false
    default: ""
  aws-s3-object-key:
    description: 'Name of the GitHub-team -> Slack-user-group mapping JSON object in S3. Required unless team-mapping-json is provided.'
    required: false
    default: ""
  team-mapping-json:
    description: 'Optional inline JSON string of the team mapping. Overrides the S3 fetch when provided. Shape: {"teams":[{"github_team_slug":"...","slack_user_group_id":"S..."}]}. Useful for local testing or when S3 is not yet set up.'
    required: false
    default: ""
  base-branch:
    description: "Branch that you will be opening PRs in to (e.g. 'staging', 'master')."
    required: true
  bot-token:
    description: "OAuth token for your Slack App Bot to sign requests to Slack's API with."
    required: true
  channel-id:
    description: "ID of the channel or conversation in Slack you would like messages posted to."
    required: true
  github-token:
    description: "Personal access token with repository rights."
    required: true
  label-name-to-watch-for:
    description: "If you would like to notify the thread of a label being applied to a PR, set this."
    required: false
    default: ""
  label-for-initial-notification:
    description: "The label that triggers initial Slack notifications when applied to the PR."
    required: true
  ignore-draft-prs:
    description: "Do not message on draft PRs"
    required: false
    default: "false"
  silence-on-quiet-label:
    description: "Do not message if the PR has the `quiet` label"
    required: false
    default: "false"
  fail-silently:
    description: "Allow action to fail silently to hide the red X of death"
    required: false
    default: "false"
  verbose:
    description: "If verbose is set to true, the entire PR text is posted to Slack. If false, just the title is posted."
    required: false
    default: "true"
runs:
  using: "node24"
  main: "dist/index.js"
